
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Cards</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="product-container">
        <div class="product-card">
            <div class="image-box">
                <img src="images (1).jpg" alt="Baked Bread">
            </div>
            <div class="product-info">
                <h2>Baked Bread</h2>
                <p class="price">
                    20.00$ <del>25.25$</del>
                </p>
                <p class="description">
                    
                    Our fresh baked bread is soft inside and
                    crispy outside. Enjoy its delicious taste
                    with your favorite meal.
                </p>

                <button>BUY NOW</button>
            </div>
        </div>
        <div class="product-card">
            <div class="image-box">
                <img src="fresh soup.jpg" alt="Fresh Soup">
            </div>
            <div class="product-info">
                <h2>Fresh Soup</h2>
                <p class="price">
                    18.99$ <del>24.99$</del>
                </p>
                <p class="description">
                    Enjoy our delicious, healthy vegetable soup,
                    made with fresh ingredients and full
                    of natural flavor.
                </p>
                <button>BUY NOW</button>
            </div>
        </div>

    </div>

</body>
</html>
